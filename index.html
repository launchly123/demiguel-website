      if (mo) mo.disconnect();
      try {
        var all = document.body.getElementsByTagName("*");
        var ti = 0, ii = 0;
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          if (el.tagName === "IMG") {
            if (el.closest("header,nav")) continue;
            var ik = "i" + (ii++);
            if (overrides[ik]) el.src = overrides[ik];
          } else if (isTextLeaf(el)) {
            var tk = "t" + (ti++);
            if (overrides[tk] != null) el.textContent = overrides[tk];
          }
        }
      } catch (e) {}
      if (mo) mo.observe(document.body, { childList: true, subtree: true });
    }

    fetch(CMS + "/api/public/overrides/" + SLUG)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        overrides = (d && d.overrides) || {};
        if (!Object.keys(overrides).length) return;
        mo = new MutationObserver(function () {
          clearTimeout(mo._t); mo._t = setTimeout(apply, 120);
        });
        apply();
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
